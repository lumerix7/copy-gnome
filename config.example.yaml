# copy-gnome example config.
# Copy to:  $COPY_GNOME_HOME/config/config.yaml
#   (default $COPY_GNOME_HOME = /opt/copy-gnome/$USER)
# Everything is optional; omitted keys fall back to the built-in defaults.
# config.json is also accepted (same keys) if you prefer JSON.

general:
  captureFiles: true             # copied files are stored as URI/path references only
  captureImages: true            # screenshot/image clipboard capture; risky on GNOME Shell 46

history:
  maxItems: 30                    # visible history count, max 100
  maxItemBytes: 4194304           # 4 MiB default; max 16 MiB
  maxAgeDays: 0                   # 0 = never expire by age
  dedup: true

storage:
  backend: jsonl
  textMaxBytes: 65536             # 64 KiB; larger text payloads are skipped
  binaryMaxBytes: 16384           # 16 KiB; larger non-file image/binary payloads are skipped
  flushIntervalSec: 60
  debounceMs: 500

privacy:
  # Optional: skip clipboard entries that advertise these MIME hints.
  # Leave empty if you want password/token copies to remain pasteable from history.
  secretMimes: []
  # secretMimes: ["x-kde-passwordManagerHint"]

ui:
  popupWidth: 640                 # px; auto-shrinks on small monitors
  popupMaxHeight: 800             # px; auto-shrinks on small monitors
  popupOffsetX: 0                 # final px adjustment from centered position
  popupOffsetY: 0
  popupEdgeMargin: 8              # min distance from monitor edge
  popupOpacity: 0.82              # whole panel opacity, 0.1..1
  numberPickTimeoutMs: 500        # wait for multi-digit row numbers, e.g. 1 vs 11
  showThumbnails: false           # reserved; current popup uses text-only image previews
  autoPaste: true                 # also inject the paste keystroke after restore. The
                                  # clipboard is ALWAYS set regardless, so you can paste
                                  # manually even if auto-paste picks the wrong combo.
  autoPasteDelayMs: 220           # delay before injecting paste after popup closes
  pasteRestoresFocus: true
  # Terminals paste with Ctrl+Shift+V (matched by wm_class substring):
  terminalApps:
    - gnome-terminal
    - org.gnome.Terminal
    - org.gnome.Console
    - kgx
    - konsole
    - xterm
    - alacritty
    - kitty
    - foot
    - wezterm
    - tilix
    - terminator
  # Per-app overrides, checked before terminalApps. combo: ctrl-v | ctrl-shift-v |
  # shift-insert | none  (none = only set the clipboard, no keystroke).
  pasteOverrides: []
  #   - match: Emacs
  #     combo: none

logging:
  level: info                     # error | warn | info | debug
