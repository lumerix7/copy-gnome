# copy-gnome example config.
# Copy to: /opt/home/$USER/.config/copy-gnome/config.yaml
# Fallback path when /opt/home/$USER is unavailable:
#   ~/.config/copy-gnome/config.yaml
# Everything is optional; omitted keys fall back to the built-in defaults.
# config.json is also accepted (same keys) if you prefer JSON.

general:
  captureFiles: true              # copied files are stored as URI/path references only
  captureImages: true             # screenshot/image clipboard capture; risky inside GNOME Shell

history:
  maxItems: 200                   # visible history count, max 1000
  maxItemBytes: 4194304           # 4 MiB default; max 16 MiB
  maxAgeDays: 3                   # 0 = keep all daily files; N deletes clips-*.jsonl older than N days
  cleanupIntervalSec: 86400       # periodic expired-file sweep interval (seconds), 15..864000

storage:
  backend: jsonl
  textMaxBytes: 1048576           # 1 MiB default; max 15 MiB, also bounded by maxItemBytes
  binaryMaxBytes: 1048576         # 1 MiB default; max 10 MiB raw, also bounded by maxItemBytes
  flushIntervalSec: 1800          # append latest snapshot once per N sec (the only disk writer)

privacy:
  # Optional: skip clipboard entries that advertise these MIME hints.
  # Leave empty if you want password/token copies to remain pasteable from history.
  secretMimes: []
  # secretMimes: ["x-kde-passwordManagerHint"]

ui:
  popupWidth: 640                 # px, 240..8000; auto-shrinks to monitor
  popupMaxHeight: 800             # px, 120..8000; auto-shrinks to monitor
  popupOffsetX: 0                 # final px adjustment from centered position
  popupOffsetY: 0
  popupEdgeMargin: 8              # min distance from monitor edge
  popupOpacity: 0.92              # whole panel opacity, 0.1..1
  popupTheme: auto                # auto | dark | light; dark is neutral charcoal, not pure black
  numberPickTimeoutMs: 500        # wait for multi-digit row numbers, e.g. 1 vs 11
  showThumbnails: false           # reserved; current popup uses text-only image previews
  autoPaste: true                 # also inject the paste keystroke after restore
  autoPasteDelayMs: 220           # delay before injecting paste after popup closes
  pasteRestoresFocus: true
  skipClipboardWriteForRecentTopSec: 3
                                  # 0 disables. If row 1 was updated within this many
                                  # seconds, restore/paste it without rewriting clipboard.
  fileApps:                       # lower-case wm_class substrings that receive copied
    - org.gnome.nautilus          # files as text/uri-list; others receive path text
  richTextApps:                   # rich-text records restore with primary rich MIME for these apps
    - libreoffice
    - soffice
  plainTextApps:                  # wins over richTextApps; restore rich text as text/plain
    - terminal
  defaultPasteKeys:               # used when no pasteKeybindings entry matches
    - ctrl
    - v
  pasteKeybindings:               # matched by lower-case wm_class substring
    - keys: [ctrl, shift, v]      # case-insensitive; order/repeats preserved
      apps: [terminal]

logging:
  level: info                      # error | warn | info | debug
